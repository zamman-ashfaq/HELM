<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Physical Scan · HELM Astronaut Health</title>
<meta name="description" content="On-device body scan: live pose skeleton, joint angles, range of motion and a fatigue screen. Video never leaves the device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23060b14'/%3E%3Cpath d='M12 3 5 6v6c0 4.4 3 7.6 7 9 4-1.4 7-4.6 7-9V6l-7-3Z' fill='none' stroke='%2322d3ee' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/scan.css">
</head>
<body>
<div class="shell" data-page="physical" data-title="Physical Assessment">
  <div class="main">
    <header class="site-nav" data-nav></header>

    <main class="page">
      <header class="pagehead">
        <div class="wrap panel-head rise" style="margin-bottom:0">
          <div>
            <span class="eyebrow">On-device vision</span>
            <h1>Physical scan</h1>
          </div>
          <span class="spacer"></span>
          <span class="pill" id="modePill"><span>Checking runtime…</span></span>
        </div>
      </header>

      <div class="wrap stack">

      <section class="scan-grid">
        <div class="scan-main">

          <!-- ---------------------------------------------------- stage -->
          <div class="stage-card">
            <div class="stage" id="stage">
              <video id="vid" playsinline muted loop></video>
              <canvas id="overlay" class="stage-canvas" width="640" height="360"></canvas>
              <div class="frame-guide" aria-hidden="true"></div>

              <div class="stage-empty" id="stageEmpty">
                <span class="stage-ico" id="stageIco"></span>
                <span class="stage-actions">
                  <button class="btn btn-primary" type="button" id="pickBtn">Upload</button>
                  <button class="btn btn-ghost" type="button" id="camBtn">Camera</button>
                </span>
                <span class="stage-hint">MP4 · WebM · MOV</span>
              </div>

              <div class="hud hud-tl">
                <svg class="tring" viewBox="0 0 44 44" aria-hidden="true">
                  <circle class="tring-bg" cx="22" cy="22" r="18"></circle>
                  <circle class="tring-fill" id="ringFill" cx="22" cy="22" r="18"></circle>
                </svg>
                <span id="hudState">Standby</span>
              </div>

              <div class="hud hud-tr">
                <span class="hud-k">FPS</span><b id="hudFps">—</b>
                <span class="hud-k">TRACK</span><b id="hudConf">—</b>
                <button class="hud-btn" id="expandBtn" type="button" aria-pressed="false" title="Expand stage" aria-label="Expand stage">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                </button>
              </div>

              <div class="countdown" id="countdown" hidden><b id="cdNum">20</b></div>

              <div class="frame-pill is-idle" id="framePill">
                <i class="fdot"></i><span id="frameText">Framing check</span>
              </div>
            </div>

            <p class="stage-msg" id="stageMsg" hidden></p>

            <div class="stage-bar">
              <button class="btn btn-primary" id="scanBtn" type="button" disabled>Start scan</button>
              <button class="btn btn-sm btn-ghost" id="uploadBtn" type="button">Upload</button>
              <button class="btn btn-sm btn-ghost" id="cameraBtn" type="button">Camera</button>
              <button class="btn btn-sm btn-ghost" id="resetBtn" type="button">Reset</button>
              <span class="grow"></span>
              <button class="btn btn-sm btn-ghost" id="forceBtn" type="button" hidden>Start anyway</button>
              <span class="prog" id="progressText">No source</span>
            </div>
            <div class="meter" style="margin-top:10px"><i id="prog" style="width:0%"></i></div>
            <input type="file" id="file" accept="video/*" hidden>
          </div>

          <!-- ------------------------------------------------- self report -->
          <div class="self-row">
            <label class="self-cell" for="fatigueRange">
              <span>Fatigue <output id="fatigueOut">—</output></span>
              <input id="fatigueRange" type="range" min="0" max="100" step="1" value="40">
            </label>
            <label class="self-cell" for="sleepInput">
              <span>Sleep <em>h</em></span>
              <input id="sleepInput" type="number" min="0" max="14" step="0.25" placeholder="—">
            </label>
          </div>

          <!-- -------------------------------------------------- metrics -->
          <div class="metrics" id="metrics" aria-live="polite"></div>

          <!-- ---------------------------------------------------- trace -->
          <div class="panel trace-card">
            <div class="trace-head">
              <span class="eyebrow">Movement trace</span>
              <span class="spacer"></span>
              <span class="trace-meta" id="traceMeta">per-mille of frame change</span>
            </div>
            <div id="trace"></div>
            <div class="save-row" id="saveRow" hidden>
              <button class="btn btn-primary" id="saveBtn" type="button">Save to record</button>
              <button class="btn btn-ghost" id="saveNewBtn" type="button">Save as new day</button>
            </div>
          </div>
        </div>

        <!-- ------------------------------------------------------ side -->
        <aside class="scan-side">
          <div class="panel body-card">
            <div class="trace-head">
              <span class="eyebrow">Body map</span>
              <span class="spacer"></span>
              <span class="body-legend"><i class="lg ok"></i><i class="lg warn"></i><i class="lg off"></i></span>
            </div>

            <svg class="body" viewBox="0 0 120 300" role="img" aria-label="Tracked joints">
              <g class="body-line">
                <circle cx="60" cy="38" r="17"></circle>
                <path d="M60 55v11"></path>
                <path d="M38 70 C40 96 42 126 46 152 L74 152 C78 126 80 96 82 70 Z"></path>
                <path d="M38 70 L24 118 L18 158"></path>
                <path d="M82 70 L96 118 L102 158"></path>
                <path d="M46 152 L44 214 L43 274"></path>
                <path d="M74 152 L76 214 L77 274"></path>
                <path d="M46 152h28"></path>
                <path class="floor" d="M26 280h68"></path>
              </g>
              <g class="body-sweep"><rect x="18" y="0" width="84" height="2"></rect></g>
              <g class="body-dots">
                <circle class="jdot" data-joint="left_shoulder" cx="38" cy="70" r="6" tabindex="0"><title>Left shoulder</title></circle>
                <circle class="jdot" data-joint="right_shoulder" cx="82" cy="70" r="6" tabindex="0"><title>Right shoulder</title></circle>
                <circle class="jdot" data-joint="left_elbow" cx="24" cy="118" r="6" tabindex="0"><title>Left elbow</title></circle>
                <circle class="jdot" data-joint="right_elbow" cx="96" cy="118" r="6" tabindex="0"><title>Right elbow</title></circle>
                <circle class="jdot" data-joint="left_hip" cx="46" cy="152" r="6" tabindex="0"><title>Left hip</title></circle>
                <circle class="jdot" data-joint="right_hip" cx="74" cy="152" r="6" tabindex="0"><title>Right hip</title></circle>
                <circle class="jdot" data-joint="left_knee" cx="44" cy="214" r="6" tabindex="0"><title>Left knee</title></circle>
                <circle class="jdot" data-joint="right_knee" cx="76" cy="214" r="6" tabindex="0"><title>Right knee</title></circle>
              </g>
            </svg>

            <div class="jread" id="jointOut">No joint selected</div>
          </div>

          <details class="panel det" id="detPanel">
            <summary>Details</summary>
            <div class="det-body" id="detBody"></div>
          </details>

          <div class="chips proto" id="proto"></div>
        </aside>
      </section>

      </div>
    </main>

    <footer class="foot">
      <span id="srcFoot">Vision: on device</span>
      <span class="sep">|</span>
      <span>Video is never uploaded or recorded</span>
      <span class="foot-status">
        <span class="dot-row"><span class="dot" id="llmDot"></span><span id="llmText">Advisor idle</span></span>
        <span class="dot-row"><span class="dot" id="queueDot"></span><span id="offlineCount">0 check-ins stored</span><span class="sep">·</span><span id="queueText">Sync idle</span></span>
      </span>
    </footer>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/charts.js"></script>
<script src="js/vision.js"></script>
<script src="js/page-scanning.js"></script>
</body>
</html>
